name: Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create isolated test Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run backend pytest, then all three Verify suites
        run: |
          overall=0
          if ! .venv/bin/python scripts/run_render_build_tests.py; then overall=1; fi
          for suite in general escalation regression; do
            output="runtime/ci-verify-${suite}.json"
            if ! .venv/bin/python -m src.verify.runner --suite "$suite" --output "$output"; then overall=1; fi
            if [ -f "$output" ]; then
              jq -c --arg suite "$suite" '.[] | {suite: $suite, case_id, case_name, expected, actual: {provider: .actual.evaluation.provider, model_version: .actual.evaluation.model_version, outcome: .actual.decision.outcome, plan_status: .actual.plan.state.plan_status, processing_stage: .actual.plan.state.processing_stage, escalation_category: .actual.decision.escalation_category, final_decision: .actual.final_decision, decision_source: .actual.decision_source}, passed, differences}' "$output"
            else
              echo "No result file was produced for Verify suite: $suite"
              overall=1
            fi
          done
          exit "$overall"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-expected-actual
          path: runtime/ci-verify-*.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

  judge-demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated test Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run isolated Judge Demo browser workflow
        run: npm run test:e2e -- --config playwright.config.ts workflow.spec.ts
        env:
          ORGANIZATIONAI_TEST_PYTHON: .venv/bin/python
      - name: Run isolated Public Judge-only acceptance, actions, and responsive layout
        run: npm run test:e2e -- --config playwright.config.ts public-judge.spec.ts public-judge-layout.spec.ts public-judge-actions.spec.ts
        env:
          APP_ENV: demo
          PUBLIC_JUDGE_ONLY: 'true'
          VITE_DEMO_ENABLED: 'true'
          VITE_PUBLIC_JUDGE_ONLY: 'true'
          VITE_API_BASE_URL: http://127.0.0.1:8008/api
          ORGANIZATIONAI_TEST_PYTHON: .venv/bin/python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: judge-demo-playwright-report
          path: frontend/test-results/
          if-no-files-found: ignore

  postgres-auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_USER: organizationai_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -U organizationai_test -d organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated test Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify migrations against disposable PostgreSQL
        run: |
          .venv/bin/python scripts/verify_postgres_test_target.py
          .venv/bin/alembic upgrade head
          .venv/bin/python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, inspect, text

          alembic_config = Config('alembic.ini')
          migration_heads = ScriptDirectory.from_config(alembic_config).get_heads()
          assert len(migration_heads) == 1, f'Expected exactly one Alembic head, found {migration_heads}'
          # Compare the migrated database with this checkout's current head instead of
          # pinning CI to a revision that becomes stale when the schema advances.
          expected_head = migration_heads[0]

          engine = create_engine(os.environ['DATABASE_URL'])
          try:
              inspector = inspect(engine)
              tables = set(inspector.get_table_names())
              required_tables = {
                  'auth_workflow_plans', 'employee_profiles', 'role_permissions',
                  'auth_management_tokens', 'admin_audit_events',
              }
              with engine.connect() as connection:
                  revisions = connection.scalars(text('SELECT version_num FROM alembic_version')).all()
              assert revisions == [expected_head], (
                  f'Database revisions {revisions} do not match Alembic head {expected_head}'
              )
              missing_tables = required_tables - tables
              assert not missing_tables, f'Missing EMP/account/token tables: {sorted(missing_tables)}'
              assert {
                  'status', 'activation_pending', 'session_version', 'employment_status',
              } <= {column['name'] for column in inspector.get_columns('users')}
              assert {'is_builtin', 'status'} <= {
                  column['name'] for column in inspector.get_columns('roles')
              }
              assert {
                  'user_code', 'display_name', 'employment_status', 'user_id',
              } <= {column['name'] for column in inspector.get_columns('employee_profiles')}
              assert {
                  'user_id', 'issued_by', 'purpose', 'token_hash', 'expires_at', 'consumed_at',
              } <= {column['name'] for column in inspector.get_columns('auth_management_tokens')}
              assert any(
                  item['name'] == 'ck_auth_management_tokens_purpose'
                  for item in inspector.get_check_constraints('auth_management_tokens')
              ), 'Auth management token purpose constraint is missing'
              assert any(
                  item['name'] == 'uq_auth_workflow_plans_maker_creation_key' and item['unique']
                  for item in inspector.get_indexes('auth_workflow_plans')
              )
              print(
                  f'PostgreSQL migration: single Alembic head {expected_head}; '
                  'EMP/account/token schema and draft idempotency index present.'
              )
          finally:
              engine.dispose()
          PY
        working-directory: .
        env:
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_DATABASE: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_USER: organizationai_test
          POSTGRES_TEST_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
      - name: Seed disposable local Auth users
        run: .venv/bin/python -m src.backend.seed_auth
        working-directory: .
        env:
          APP_ENV: demo
          AUTH_SEED_ENABLED: 'true'
          AUTH_SEED_PASSWORD: ci-only-auth-password
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_DATABASE: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_USER: organizationai_test
          POSTGRES_TEST_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
      - name: Prepare isolated SLA PostgreSQL databases
        run: |
          .venv/bin/python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          import psycopg
          from psycopg import sql
          from scripts.postgres_test_target import verify_runner_provisioned_database

          base_url = verify_runner_provisioned_database(os.environ)
          databases = (
              os.environ["AUTH_E2E_POSTGRES_TEST_DATABASE"],
              os.environ["SLA_POSTGRES_TEST_DATABASE"],
              os.environ["SLA_EMPTY_POSTGRES_TEST_DATABASE"],
          )
          if any(
              not (
                  re.fullmatch(r"organizationai_auth_e2e_[a-z0-9_]{1,40}", name)
                  or re.fullmatch(r"organizationai_sla_[a-z0-9_]{1,40}", name)
              )
              for name in databases
          ):
              raise RuntimeError("Run-scoped Auth/SLA database name is invalid.")

          with psycopg.connect(
              host=base_url.host,
              port=base_url.port,
              dbname="postgres",
              user=base_url.username,
              password=base_url.password,
              autocommit=True,
          ) as connection:
              for database in databases:
                  exists = connection.execute(
                      "SELECT 1 FROM pg_database WHERE datname = %s", (database,)
                  ).fetchone()
                  if exists:
                      raise RuntimeError("A run-scoped SLA database already exists.")
                  connection.execute(
                      sql.SQL("CREATE DATABASE {}").format(sql.Identifier(database))
                  )

          for database in databases:
              environment = os.environ.copy()
              environment["DATABASE_URL"] = base_url.set(database=database).render_as_string(
                  hide_password=False
              )
              environment["APP_ENV"] = "demo"
              environment["AUTH_SEED_ENABLED"] = "true"
              subprocess.run(
                  [sys.executable, "-m", "alembic", "upgrade", "head"],
                  check=True,
                  env=environment,
              )
              subprocess.run(
                  [sys.executable, "-m", "src.backend.seed_auth"],
                  check=True,
                  env=environment,
              )
          PY
        working-directory: .
        env:
          APP_ENV: demo
          AUTH_SEED_ENABLED: 'true'
          AUTH_SEED_PASSWORD: ci-only-auth-password
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_DATABASE: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_USER: organizationai_test
          POSTGRES_TEST_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
          AUTH_E2E_POSTGRES_TEST_DATABASE: organizationai_auth_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          SLA_POSTGRES_TEST_DATABASE: organizationai_sla_acceptance_${{ github.run_id }}_${{ github.run_attempt }}
          SLA_EMPTY_POSTGRES_TEST_DATABASE: organizationai_sla_empty_${{ github.run_id }}_${{ github.run_attempt }}
      - name: Verify complete PostgreSQL acceptance marker selection
        run: |
          .venv/bin/python - <<'PY'
          import subprocess
          import sys

          expected = {
              "tests/integration/test_approval_configuration_api.py::test_admin_api_returns_unconfigured_and_rejects_maker",
              "tests/integration/test_approval_configuration_api.py::test_admin_revision_requires_allowed_browser_origin_and_keeps_auto_approval_off",
              "tests/integration/test_approval_configuration_api.py::test_concurrent_first_revision_has_exactly_one_winner",
              "tests/integration/test_approval_configuration_api.py::test_round_version_and_configuration_snapshot_rollback_together",
              "tests/integration/test_auth_sla_postgres.py::test_postgres_snapshot_boundaries_recipients_replay_reassignment_and_resubmit",
              "tests/integration/test_auth_sla_postgres.py::test_postgres_concurrent_config_writes_and_submit_capture_one_revision",
              "tests/integration/test_auth_sla_postgres.py::test_postgres_parallel_workers_are_idempotent_and_rollback_is_atomic",
              "tests/integration/test_auth_sla_postgres.py::test_postgres_decision_and_checker_reassignment_win_worker_lock_races",
              "tests/integration/test_auth_sla_postgres.py::test_postgres_migration_constraints_indexes_and_immutability_triggers",
              "tests/integration/test_auth_sla_postgres.py::test_postgres_missing_and_disabled_configuration_do_not_start_a_round",
              "tests/integration/test_auth_workflow_postgres_notifications.py::test_postgres_retry_race_reuses_the_round_snapshot",
              "tests/integration/test_auth_workflow_postgres_notifications.py::test_postgres_committed_submission_survives_provider_timeout",
              "tests/integration/test_auth_workflow_postgres_notifications.py::test_postgres_late_vlm_result_is_audited_after_recovery",
              "tests/integration/test_auth_workflow_postgres_notifications.py::test_postgres_policy_conflict_persists_safe_attempt_provenance_and_routes_to_checker",
              "tests/integration/test_auth_workflow_postgres_notifications.py::test_postgres_notification_lifecycle_permissions_replay_and_rollback",
              "tests/integration/test_auth_workflow_postgres_notifications.py::test_postgres_retry_evaluator_failure_audit_persists_disposition_and_round[False-APPLIED-HUMAN_REVIEW_REQUIRED-PENDING_APPROVAL-HUMAN_REVIEW_REQUIRED]",
              "tests/integration/test_auth_workflow_postgres_notifications.py::test_postgres_retry_evaluator_failure_audit_persists_disposition_and_round[True-STALE-IGNORED_STALE-APPROVED-COMPLETED]",
              "tests/integration/test_auth_workflow_postgres_notifications.py::test_postgres_recovery_without_version_snapshot_audits_missing_version_route",
              "tests/integration/test_approval_configuration_api.py::test_postgres_custom_role_crud_assignment_and_audit",
              "tests/integration/test_approval_configuration_api.py::test_postgres_employee_update_rejects_status_mass_assignment",
              "tests/integration/test_approval_configuration_api.py::test_postgres_employee_role_filter_uses_permissions_across_custom_roles",
              "tests/integration/test_approval_configuration_api.py::test_postgres_role_admin_keeps_admin_grants_self_assignment_and_builtins_locked",
              "tests/integration/test_approval_configuration_api.py::test_postgres_checker_reassignment_audit_records_version_round_and_result",
              "tests/integration/test_approval_configuration_api.py::test_checker_assignment_config_requires_approver_permission",
          }
          result = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", "-m", "postgres"],
              check=False,
              text=True,
              capture_output=True,
          )
          print(result.stdout, end="")
          if result.stderr:
              print(result.stderr, file=sys.stderr, end="")
          if result.returncode:
              raise SystemExit(result.returncode)
          selected = {
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip().startswith("tests/")
          }
          if selected != expected:
              print(f"Missing PostgreSQL acceptance tests: {sorted(expected - selected)}", file=sys.stderr)
              print(f"Unexpected PostgreSQL-marked tests: {sorted(selected - expected)}", file=sys.stderr)
              raise SystemExit(1)
          print("Verified exact PostgreSQL marker selection: all 24 configuration, employee, retry, SLA, and notification acceptance tests.")
          PY
        working-directory: .
        env:
          APP_ENV: demo
          AUTH_SEED_PASSWORD: ci-only-auth-password
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_DATABASE: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_USER: organizationai_test
          POSTGRES_TEST_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
          SLA_POSTGRES_TEST_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_sla_acceptance_${{ github.run_id }}_${{ github.run_attempt }}
          SLA_EMPTY_POSTGRES_TEST_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_sla_empty_${{ github.run_id }}_${{ github.run_attempt }}
      - name: Run PostgreSQL SLA and notification acceptance
        run: .venv/bin/python -m pytest -q -m postgres
        working-directory: .
        env:
          APP_ENV: demo
          AUTH_SEED_PASSWORD: ci-only-auth-password
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_DATABASE: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_USER: organizationai_test
          POSTGRES_TEST_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
          SLA_POSTGRES_TEST_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_sla_acceptance_${{ github.run_id }}_${{ github.run_attempt }}
          SLA_EMPTY_POSTGRES_TEST_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_sla_empty_${{ github.run_id }}_${{ github.run_attempt }}
          JWT_SECRET: ci-only-test-jwt-secret-at-least-32-characters
      - name: Start Auth API and frontend against disposable PostgreSQL
        id: auth-e2e-servers
        run: |
          exec 9>/tmp/organizationai-auth-e2e-port-allocation.lock
          flock 9
          cd ..
          read -r api_port frontend_port < <(.venv/bin/python - <<'PY'
          import os
          import socket

          ports = []
          for _ in range(16):
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
                  listener.bind(('127.0.0.1', 0))
                  port = listener.getsockname()[1]
              if port not in ports:
                  ports.append(port)
              if len(ports) == 2:
                  break
          if len(ports) != 2:
              raise RuntimeError('Could not select two distinct Auth E2E loopback ports.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'api_port={ports[0]}', file=output)
              print(f'frontend_port={ports[1]}', file=output)
          print(*ports)
          PY
          )
          export CORS_ORIGINS="http://127.0.0.1:$frontend_port"
          export VITE_API_BASE_URL="http://127.0.0.1:$api_port/api"
          nohup .venv/bin/python -m uvicorn src.backend.api.app:app --host 127.0.0.1 --port "$api_port" > "$RUNNER_TEMP/auth-api.log" 2>&1 &
          nohup npm --prefix frontend run dev -- --host 127.0.0.1 --port "$frontend_port" --strictPort > "$RUNNER_TEMP/auth-frontend.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail "http://127.0.0.1:$api_port/api/health/ready" >/dev/null \
              && curl --silent --fail "http://127.0.0.1:$frontend_port/" >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail "http://127.0.0.1:$api_port/api/health/ready" >/dev/null \
            || ! curl --silent --fail "http://127.0.0.1:$frontend_port/" >/dev/null; then
            cat "$RUNNER_TEMP/auth-api.log"
            cat "$RUNNER_TEMP/auth-frontend.log"
            exit 1
          fi
          cors_headers="$(curl --silent --show-error --fail --request OPTIONS \
            --header "Origin: http://127.0.0.1:$frontend_port" \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header - --output /dev/null \
            "http://127.0.0.1:$api_port/api/health/ready")"
          printf '%s\n' "$cors_headers" | grep --ignore-case --fixed-strings \
            "access-control-allow-origin: http://127.0.0.1:$frontend_port" >/dev/null
          printf 'Auth E2E ports: frontend=%s api=%s; CORS origin verified.\n' "$frontend_port" "$api_port"
          flock -u 9
        env:
          APP_ENV: demo
          AUTH_SEED_PASSWORD: ci-only-auth-password
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_auth_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          JWT_SECRET: ci-only-test-jwt-secret-at-least-32-characters
          AUTH_WORKFLOW_AI_PROVIDER: MOCK_VLM
          AUTH_WORKFLOW_MOCK_SCENARIO: review
          AUTH_COOKIE_SECURE: 'false'
          VITE_DEMO_ENABLED: 'true'
      - name: Run Auth Maker-Checker browser workflow against PostgreSQL
        run: npm run test:e2e -- --config playwright.auth-live.config.ts
        env:
          AUTH_SEED_PASSWORD: ci-only-auth-password
          AUTH_E2E_BASE_URL: http://127.0.0.1:${{ steps.auth-e2e-servers.outputs.frontend_port }}
          VITE_API_BASE_URL: http://127.0.0.1:${{ steps.auth-e2e-servers.outputs.api_port }}/api
      - name: Build disposable SLA worker image
        run: docker build --file deployment/Dockerfile.backend-dev --tag "organizationai-sla-worker-${{ github.run_id }}-${{ github.run_attempt }}" .
        working-directory: .
      - name: Start isolated clocked SLA API and worker
        id: sla-e2e-servers
        run: |
          set -euo pipefail
          run_id="${{ github.run_id }}_${{ github.run_attempt }}"
          worker_container="oa-sla-worker-$run_id"
          clock_root="$RUNNER_TEMP/organizationai-sla-clock-$run_id"
          mkdir -p "$clock_root"
          printf '%s\n' '{"now":"2026-11-01T12:00:00+00:00"}' > "$clock_root/clock.json"
          postgres_id="${{ job.services.postgres.id }}"
          postgres_network="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.NetworkID}}{{end}}' "$postgres_id")"
          if [ -z "$postgres_network" ]; then
            echo "Could not identify this job's disposable PostgreSQL network." >&2
            exit 1
          fi
          read -r api_port vite_port < <(.venv/bin/python - <<'PY'
          import socket
          ports = []
          for _ in range(32):
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
                  listener.bind(("127.0.0.1", 0))
                  port = listener.getsockname()[1]
              if port not in ports:
                  ports.append(port)
              if len(ports) == 2:
                  break
          if len(ports) != 2:
              raise RuntimeError("Could not allocate two distinct SLA E2E ports.")
          print(*ports)
          PY
          )
          echo "api_port=$api_port" >> "$GITHUB_OUTPUT"
          echo "vite_port=$vite_port" >> "$GITHUB_OUTPUT"
          docker run --detach --rm --name "$worker_container" \
            --network "$postgres_network" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$clock_root:/sla-test:ro" \
            --env "DATABASE_URL=postgresql+psycopg://organizationai_test:ci-only-test-password@postgres:5432/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}" \
            --entrypoint sleep "organizationai-sla-worker-${{ github.run_id }}-${{ github.run_attempt }}" infinity
          echo "SLA_TEST_CLOCK_FILE=$clock_root/clock.json" >> "$GITHUB_ENV"
          echo "SLA_TEST_API_CONTAINER=$worker_container" >> "$GITHUB_ENV"
          echo "SLA_TEST_CLOCK_CONTAINER_FILE=/sla-test/clock.json" >> "$GITHUB_ENV"
          echo "SLA_TEST_WORKER_SCRIPT=/workspace/scripts/run_sla_clocked_worker.py" >> "$GITHUB_ENV"
          echo "SLA_E2E_VITE_PORT=$vite_port" >> "$GITHUB_ENV"
          echo "SLA_TEST_API_PORT=$api_port" >> "$GITHUB_ENV"
          api_database_url="postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}"
          log_root="$RUNNER_TEMP/organizationai-sla-logs-$run_id"
          mkdir -p "$log_root"
          nohup env APP_ENV=demo AUTH_SEED_PASSWORD=ci-only-auth-password \
            AUTH_WORKFLOW_AI_PROVIDER=MOCK_VLM AUTH_WORKFLOW_MOCK_SCENARIO=review \
            JWT_SECRET=ci-only-test-jwt-secret-at-least-32-characters \
            DATABASE_URL="$api_database_url" SLA_TEST_CLOCK_FILE="$clock_root/clock.json" \
            SLA_TEST_API_PORT="$api_port" CORS_ORIGINS="http://127.0.0.1:$vite_port" \
            .venv/bin/python scripts/run_sla_clocked_api.py \
            > "$log_root/api.log" 2>&1 &
          echo "$!" > "$log_root/api.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail "http://127.0.0.1:$api_port/api/health/ready" >/dev/null; then break; fi
            sleep 2
          done
          if ! curl --silent --fail "http://127.0.0.1:$api_port/api/health/ready" >/dev/null; then
            cat "$log_root/api.log"
            exit 1
          fi
        working-directory: .
      - name: Run SLA browser acceptance with test-only clock and MOCK_VLM
        run: npm run test:e2e -- --config playwright.sla.config.ts
        env:
          APP_ENV: demo
          AUTH_SEED_PASSWORD: ci-only-auth-password
          AUTH_COOKIE_SECURE: 'false'
          VITE_API_BASE_URL: http://127.0.0.1:${{ steps.sla-e2e-servers.outputs.api_port }}/api
          VITE_DEMO_ENABLED: 'true'
          SLA_TEST_CLOCK_FILE: ${{ env.SLA_TEST_CLOCK_FILE }}
          SLA_TEST_API_CONTAINER: ${{ env.SLA_TEST_API_CONTAINER }}
          SLA_TEST_CLOCK_CONTAINER_FILE: ${{ env.SLA_TEST_CLOCK_CONTAINER_FILE }}
          SLA_TEST_WORKER_SCRIPT: ${{ env.SLA_TEST_WORKER_SCRIPT }}
          SLA_E2E_VITE_PORT: ${{ steps.sla-e2e-servers.outputs.vite_port }}
      - name: Clean up this run's SLA E2E resources
        if: always()
        run: |
          set +e
          run_id="${{ github.run_id }}_${{ github.run_attempt }}"
          worker_container="oa-sla-worker-$run_id"
          docker stop --time 5 "$worker_container" >/dev/null 2>&1 || true
          docker rm --force "$worker_container" >/dev/null 2>&1 || true
          docker image rm "organizationai-sla-worker-${{ github.run_id }}-${{ github.run_attempt }}" >/dev/null 2>&1 || true
          if [ -f "$RUNNER_TEMP/organizationai-sla-logs-$run_id/api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/organizationai-sla-logs-$run_id/api.pid")" >/dev/null 2>&1 || true
          fi
          rm -rf "$RUNNER_TEMP/organizationai-sla-clock-$run_id" "$RUNNER_TEMP/organizationai-sla-logs-$run_id"
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auth-postgres-playwright-report
          path: frontend/test-results/
          if-no-files-found: ignore
