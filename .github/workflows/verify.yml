name: Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create isolated test Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run backend pytest, then all three Verify suites
        run: |
          overall=0
          if ! .venv/bin/python scripts/run_render_build_tests.py; then overall=1; fi
          for suite in general escalation regression; do
            output="runtime/ci-verify-${suite}.json"
            if ! .venv/bin/python -m src.verify.runner --suite "$suite" --output "$output"; then overall=1; fi
            if [ -f "$output" ]; then
              jq -c --arg suite "$suite" '.[] | {suite: $suite, case_id, case_name, expected, actual: {provider: .actual.evaluation.provider, model_version: .actual.evaluation.model_version, outcome: .actual.decision.outcome, plan_status: .actual.plan.state.plan_status, processing_stage: .actual.plan.state.processing_stage, escalation_category: .actual.decision.escalation_category, final_decision: .actual.final_decision, decision_source: .actual.decision_source}, passed, differences}' "$output"
            else
              echo "No result file was produced for Verify suite: $suite"
              overall=1
            fi
          done
          exit "$overall"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-expected-actual
          path: runtime/ci-verify-*.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

  judge-demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated test Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run isolated Judge Demo browser workflow
        run: npm run test:e2e -- --config playwright.config.ts workflow.spec.ts
        env:
          ORGANIZATIONAI_TEST_PYTHON: .venv/bin/python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: judge-demo-playwright-report
          path: frontend/test-results/
          if-no-files-found: ignore

  postgres-auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_USER: organizationai_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -U organizationai_test -d organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated test Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify migrations against disposable PostgreSQL
        run: |
          .venv/bin/python scripts/verify_postgres_test_target.py
          .venv/bin/alembic upgrade head
          .venv/bin/python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, inspect, text

          alembic_config = Config('alembic.ini')
          migration_heads = ScriptDirectory.from_config(alembic_config).get_heads()
          assert len(migration_heads) == 1, f'Expected exactly one Alembic head, found {migration_heads}'
          expected_head = migration_heads[0]

          engine = create_engine(os.environ['DATABASE_URL'])
          try:
              inspector = inspect(engine)
              tables = set(inspector.get_table_names())
              required_tables = {
                  'auth_workflow_plans', 'employee_profiles', 'role_permissions',
                  'auth_management_tokens', 'admin_audit_events',
              }
              with engine.connect() as connection:
                  revisions = connection.scalars(text('SELECT version_num FROM alembic_version')).all()
              assert revisions == [expected_head], (
                  f'Database revisions {revisions} do not match Alembic head {expected_head}'
              )
              missing_tables = required_tables - tables
              assert not missing_tables, f'Missing EMP/account/token tables: {sorted(missing_tables)}'
              assert {
                  'status', 'activation_pending', 'session_version', 'employment_status',
              } <= {column['name'] for column in inspector.get_columns('users')}
              assert {'is_builtin', 'status'} <= {
                  column['name'] for column in inspector.get_columns('roles')
              }
              assert {
                  'user_code', 'display_name', 'employment_status', 'user_id',
              } <= {column['name'] for column in inspector.get_columns('employee_profiles')}
              assert {
                  'user_id', 'issued_by', 'purpose', 'token_hash', 'expires_at', 'consumed_at',
              } <= {column['name'] for column in inspector.get_columns('auth_management_tokens')}
              assert any(
                  item['name'] == 'ck_auth_management_tokens_purpose'
                  for item in inspector.get_check_constraints('auth_management_tokens')
              ), 'Auth management token purpose constraint is missing'
              assert any(
                  item['name'] == 'uq_auth_workflow_plans_maker_creation_key' and item['unique']
                  for item in inspector.get_indexes('auth_workflow_plans')
              )
              print(
                  f'PostgreSQL migration: single Alembic head {expected_head}; '
                  'EMP/account/token schema and draft idempotency index present.'
              )
          finally:
              engine.dispose()
          PY
        working-directory: .
        env:
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_DATABASE: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_USER: organizationai_test
          POSTGRES_TEST_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
      - name: Seed disposable local Auth users
        run: .venv/bin/python -m src.backend.seed_auth
        working-directory: .
        env:
          APP_ENV: demo
          AUTH_SEED_ENABLED: 'true'
          AUTH_SEED_PASSWORD: ci-only-auth-password
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_DATABASE: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_USER: organizationai_test
          POSTGRES_TEST_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
      - name: Run in-app notification PostgreSQL acceptance test
        run: .venv/bin/python -m pytest -q -m postgres
        working-directory: .
        env:
          APP_ENV: demo
          AUTH_SEED_PASSWORD: ci-only-auth-password
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_DATABASE: organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_TEST_USER: organizationai_test
          POSTGRES_TEST_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
          JWT_SECRET: ci-only-test-jwt-secret-at-least-32-characters
      - name: Start Auth API and frontend against disposable PostgreSQL
        id: auth-e2e-servers
        run: |
          exec 9>/tmp/organizationai-auth-e2e-port-allocation.lock
          flock 9
          cd ..
          read -r api_port frontend_port < <(.venv/bin/python - <<'PY'
          import os
          import socket

          ports = []
          for _ in range(16):
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
                  listener.bind(('127.0.0.1', 0))
                  port = listener.getsockname()[1]
              if port not in ports:
                  ports.append(port)
              if len(ports) == 2:
                  break
          if len(ports) != 2:
              raise RuntimeError('Could not select two distinct Auth E2E loopback ports.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'api_port={ports[0]}', file=output)
              print(f'frontend_port={ports[1]}', file=output)
          print(*ports)
          PY
          )
          export CORS_ORIGINS="http://127.0.0.1:$frontend_port"
          export VITE_API_BASE_URL="http://127.0.0.1:$api_port/api"
          nohup .venv/bin/python -m uvicorn src.backend.api.app:app --host 127.0.0.1 --port "$api_port" > "$RUNNER_TEMP/auth-api.log" 2>&1 &
          nohup npm --prefix frontend run dev -- --host 127.0.0.1 --port "$frontend_port" --strictPort > "$RUNNER_TEMP/auth-frontend.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail "http://127.0.0.1:$api_port/api/health/ready" >/dev/null \
              && curl --silent --fail "http://127.0.0.1:$frontend_port/" >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail "http://127.0.0.1:$api_port/api/health/ready" >/dev/null \
            || ! curl --silent --fail "http://127.0.0.1:$frontend_port/" >/dev/null; then
            cat "$RUNNER_TEMP/auth-api.log"
            cat "$RUNNER_TEMP/auth-frontend.log"
            exit 1
          fi
          cors_headers="$(curl --silent --show-error --fail --request OPTIONS \
            --header "Origin: http://127.0.0.1:$frontend_port" \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header - --output /dev/null \
            "http://127.0.0.1:$api_port/api/health/ready")"
          printf '%s\n' "$cors_headers" | grep --ignore-case --fixed-strings \
            "access-control-allow-origin: http://127.0.0.1:$frontend_port" >/dev/null
          printf 'Auth E2E ports: frontend=%s api=%s; CORS origin verified.\n' "$frontend_port" "$api_port"
          flock -u 9
        env:
          APP_ENV: demo
          AUTH_SEED_PASSWORD: ci-only-auth-password
          DATABASE_URL: postgresql+psycopg://organizationai_test:ci-only-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/organizationai_test_${{ github.run_id }}_${{ github.run_attempt }}
          JWT_SECRET: ci-only-test-jwt-secret-at-least-32-characters
          AUTH_WORKFLOW_AI_PROVIDER: MOCK_VLM
          AUTH_WORKFLOW_MOCK_SCENARIO: review
          AUTH_COOKIE_SECURE: 'false'
          VITE_DEMO_ENABLED: 'true'
      - name: Run Auth Maker-Checker browser workflow against PostgreSQL
        run: npm run test:e2e -- --config playwright.auth-live.config.ts
        env:
          AUTH_SEED_PASSWORD: ci-only-auth-password
          AUTH_E2E_BASE_URL: http://127.0.0.1:${{ steps.auth-e2e-servers.outputs.frontend_port }}
          VITE_API_BASE_URL: http://127.0.0.1:${{ steps.auth-e2e-servers.outputs.api_port }}/api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auth-postgres-playwright-report
          path: frontend/test-results/
          if-no-files-found: ignore
