name: organizationai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-organizationai}
      POSTGRES_USER: ${POSTGRES_USER:-organizationai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend-dev
    environment:
      APP_ENV: demo
      DEMO_DATABASE: /tmp/organizationai/demo-organization.sqlite3
      DEMO_MOCK_MODE: ${DEMO_MOCK_MODE:-pass}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      AUTH_REMEMBER_TOKEN_DAYS: ${AUTH_REMEMBER_TOKEN_DAYS:-14}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      AUTH_COOKIE_SECURE: "false"
      AUTH_SEED_ENABLED: "true"
      AUTH_SEED_PASSWORD: ${AUTH_SEED_PASSWORD:?Set AUTH_SEED_PASSWORD in .env}
      AUTH_WORKFLOW_AI_PROVIDER: ${AUTH_WORKFLOW_AI_PROVIDER:-LOCAL_VLM}
      LOCAL_VLM_MODEL: ${LOCAL_VLM_MODEL:-}
      LOCAL_VLM_MODEL_VERSION: ${LOCAL_VLM_MODEL_VERSION:-}
      LOCAL_VLM_BASE_URL: ${LOCAL_VLM_BASE_URL:-}
      LOCAL_VLM_ALLOW_REMOTE: ${LOCAL_VLM_ALLOW_REMOTE:-false}
      LOCAL_VLM_API_KEY: ${LOCAL_VLM_API_KEY:-}
      LOCAL_VLM_TIMEOUT_SECONDS: ${LOCAL_VLM_TIMEOUT_SECONDS:-30}
      LOCAL_VLM_MAX_OUTPUT_TOKENS: ${LOCAL_VLM_MAX_OUTPUT_TOKENS:-1536}
      LOCAL_VLM_MAX_RESPONSE_BYTES: ${LOCAL_VLM_MAX_RESPONSE_BYTES:-262144}
      LOCAL_VLM_MAX_INPUT_BYTES: ${LOCAL_VLM_MAX_INPUT_BYTES:-20971520}
      AUTH_WORKFLOW_MEDIA_PROVIDER: ${AUTH_WORKFLOW_MEDIA_PROVIDER:-}
      AUTH_WORKFLOW_MEDIA_BASE_URL: ${AUTH_WORKFLOW_MEDIA_BASE_URL:-}
      AUTH_WORKFLOW_MEDIA_MODEL: ${AUTH_WORKFLOW_MEDIA_MODEL:-}
      AUTH_WORKFLOW_MEDIA_MODEL_VERSION: ${AUTH_WORKFLOW_MEDIA_MODEL_VERSION:-}
      AUTH_WORKFLOW_MEDIA_API_KEY: ${AUTH_WORKFLOW_MEDIA_API_KEY:-}
      AUTH_WORKFLOW_MEDIA_ALLOW_REMOTE: ${AUTH_WORKFLOW_MEDIA_ALLOW_REMOTE:-false}
      AUTH_WORKFLOW_MEDIA_TIMEOUT_SECONDS: ${AUTH_WORKFLOW_MEDIA_TIMEOUT_SECONDS:-20}
      AUTH_WORKFLOW_MEDIA_MAX_OUTPUT_TOKENS: ${AUTH_WORKFLOW_MEDIA_MAX_OUTPUT_TOKENS:-2048}
      AUTH_WORKFLOW_MEDIA_MAX_RESPONSE_BYTES: ${AUTH_WORKFLOW_MEDIA_MAX_RESPONSE_BYTES:-262144}
      AUTH_WORKFLOW_MEDIA_MAX_INPUT_BYTES: ${AUTH_WORKFLOW_MEDIA_MAX_INPUT_BYTES:-1048576}
      AUTH_WORKFLOW_MEDIA_MAX_RETRIES: ${AUTH_WORKFLOW_MEDIA_MAX_RETRIES:-1}
      AUTH_WORKFLOW_MEDIA_REASONING_EFFORT: ${AUTH_WORKFLOW_MEDIA_REASONING_EFFORT:-}
      AUTH_WORKFLOW_MEDIA_PROMPT_VERSION: ${AUTH_WORKFLOW_MEDIA_PROMPT_VERSION:-media-compliance-prompt-v4}
      AUTH_WORKFLOW_MEDIA_SCHEMA_VERSION: ${AUTH_WORKFLOW_MEDIA_SCHEMA_VERSION:-media-compliance-schema-v2}
      AUTH_WORKFLOW_MEDIA_POLICY_JSON: ${AUTH_WORKFLOW_MEDIA_POLICY_JSON:-}
      AUTH_WORKFLOW_STRATEGY_PROVIDER: ${AUTH_WORKFLOW_STRATEGY_PROVIDER:-}
      AUTH_WORKFLOW_STRATEGY_BASE_URL: ${AUTH_WORKFLOW_STRATEGY_BASE_URL:-}
      AUTH_WORKFLOW_STRATEGY_MODEL: ${AUTH_WORKFLOW_STRATEGY_MODEL:-}
      AUTH_WORKFLOW_STRATEGY_MODEL_VERSION: ${AUTH_WORKFLOW_STRATEGY_MODEL_VERSION:-}
      AUTH_WORKFLOW_STRATEGY_API_KEY: ${AUTH_WORKFLOW_STRATEGY_API_KEY:-}
      AUTH_WORKFLOW_STRATEGY_ALLOW_REMOTE: ${AUTH_WORKFLOW_STRATEGY_ALLOW_REMOTE:-false}
      AUTH_WORKFLOW_STRATEGY_TIMEOUT_SECONDS: ${AUTH_WORKFLOW_STRATEGY_TIMEOUT_SECONDS:-20}
      AUTH_WORKFLOW_STRATEGY_MAX_OUTPUT_TOKENS: ${AUTH_WORKFLOW_STRATEGY_MAX_OUTPUT_TOKENS:-2048}
      AUTH_WORKFLOW_STRATEGY_MAX_RESPONSE_BYTES: ${AUTH_WORKFLOW_STRATEGY_MAX_RESPONSE_BYTES:-262144}
      AUTH_WORKFLOW_STRATEGY_MAX_INPUT_BYTES: ${AUTH_WORKFLOW_STRATEGY_MAX_INPUT_BYTES:-1048576}
      AUTH_WORKFLOW_STRATEGY_MAX_RETRIES: ${AUTH_WORKFLOW_STRATEGY_MAX_RETRIES:-1}
      AUTH_WORKFLOW_STRATEGY_REASONING_EFFORT: ${AUTH_WORKFLOW_STRATEGY_REASONING_EFFORT:-}
      AUTH_WORKFLOW_STRATEGY_PROMPT_VERSION: ${AUTH_WORKFLOW_STRATEGY_PROMPT_VERSION:-strategy-evaluation-prompt-v4}
      AUTH_WORKFLOW_STRATEGY_SCHEMA_VERSION: ${AUTH_WORKFLOW_STRATEGY_SCHEMA_VERSION:-strategy-evaluation-schema-v4}
      AUTH_WORKFLOW_STRATEGY_RUBRIC_JSON: ${AUTH_WORKFLOW_STRATEGY_RUBRIC_JSON:-}
      AUTH_WORKFLOW_MOCK_SCENARIO: ${AUTH_WORKFLOW_MOCK_SCENARIO:-pass}
      AUTH_WORKFLOW_MOCK_MODEL_VERSION: ${AUTH_WORKFLOW_MOCK_MODEL_VERSION:-mock-1}
    ports:
      - "127.0.0.1:8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && python -m src.backend.seed_auth && python -m uvicorn src.backend.api.app:app --host 0.0.0.0 --port 8010 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8010/api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
