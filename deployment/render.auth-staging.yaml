# Separate Auth/PostgreSQL staging blueprint. Never sync this file into the
# existing Judge Demo blueprint. Review the resource plan before creating it.
services:
  - type: web
    name: organizationai-auth-staging-api
    runtime: python
    region: singapore
    plan: free
    branch: feature/auth-first-staging
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m deployment.start_auth_backend
    healthCheckPath: /api/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: organizationai-auth-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_REGISTRATION_ENABLED
        value: "true"
      - key: AUTH_SEED_ENABLED
        value: "false"
      - key: AUTH_WORKFLOW_AI_PROVIDER
        value: LOCAL_VLM
      - key: LOCAL_VLM_ALLOW_REMOTE
        value: "false"
      - key: CORS_ORIGINS
        fromService:
          name: organizationai-auth-staging-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: organizationai-auth-staging-web
    runtime: static
    branch: feature/auth-first-staging
    autoDeployTrigger: "off"
    buildCommand: node --test deployment/validate_frontend.test.mjs && node deployment/validate_frontend.mjs && npm ci --include=dev --prefix frontend && npm run test --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: VITE_API_BASE_URL
        fromService:
          name: organizationai-auth-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_DEMO_ENABLED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000

databases:
  - name: organizationai-auth-staging-db
    databaseName: organizationai_auth_staging
    user: organizationai_auth_staging
    postgresMajorVersion: "16"
    region: singapore
    plan: free
    ipAllowList: []
